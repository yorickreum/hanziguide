<!DOCTYPE html>
<html lang="zh-Hant">

{% include head.html %}
{% assign t = site.data.translations.zh-Hant %}

<body>

  <div class="navbar-wrapper">
    <div class="container">
      <nav class="navbar navbar-inverse navbar-static-top">
        <div class="container">
          <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar"
              aria-expanded="false" aria-controls="navbar">
              <span class="sr-only">Toggle navigation</span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
            </button>
            <div class="mobile-language-switch" aria-label="選擇語言">
              <a href="/">EN</a>
              <a href="/cn/">简</a>
              <a class="is-current" href="/tw/" aria-current="page">繁</a>
            </div>
            <a class="navbar-brand" href="/tw/">Hanzi Guide</a>
          </div>
          <div id="navbar" class="navbar-collapse collapse">
            <ul class="nav navbar-nav navbar-right">
              <li{% if page.url == '/tw/' or page.url == '/tw/index.html' %} class="active"{% endif %}><a href="/tw/">{{ t.nav.practice }}</a></li>

              <li{% if page.url contains '/hsk-1-characters' or page.url contains '/character/' or page.url contains '/radical/' %} class="active"{% endif %}>
                <a href="/hsk-1-characters/">HSK 1</a>
              </li>

              <li{% if page.url contains '/tw/geo-quiz' %} class="active"{% endif %}>
                <a href="/tw/geo-quiz/">{{ t.nav.geo_quiz }}</a>
              </li>

              <li{% if page.url contains '/idioms' %} class="active"{% endif %}>
                <a href="/idioms/">{{ t.nav.idioms }}</a>
              </li>

              <li class="dropdown{% if page.url contains '/howto' %} active{% endif %}">
                <a href="/tw/howto/" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">
                  {{ t.nav.howto }} <span class="caret"></span>
                </a>
                <ul class="dropdown-menu">
                  <li><a href="/tw/howto/stroke-order/">{{ t.nav.stroke_order }}</a></li>
                  <li><a href="/tw/howto/radicals/">{{ t.nav.radicals }}</a></li>
                </ul>
              </li>

              <li class="language-switch-item">
                <a class="language-option" href="/">EN</a>
                <a class="language-option" href="/cn/">简</a>
                <a class="language-option is-current" href="/tw/" aria-current="page">繁</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </div>

  {{ content }}

  {% include footer.html %}

</body>

</html>
