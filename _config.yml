# Site settings
title: Hanzi Guide
email: tech@yorickreum.de
description: >
  Hanzi Guide is a free educational tool with animated Chinese stroke order, radical decomposition,
  Pinyin and Jyutping, and Mandarin and Cantonese pronunciation audio for simplified and traditional characters.
baseurl: "/" # the subpath of your site, e.g. /blog/
url: "https://www.hanzi.guide" # the base hostname & protocol for your site
github_username:  yorickreum

# Hanzi Guide Unit Horizontal. ADSENSE_SLOT_ID can override this in deployment.
# With no slot configured, no advertising script or empty ad space is rendered.
adsense_slot: "7163092498"
adsense_square_slot: "9573633413"
# Placement channels are assigned in the tag, rather than to the shared unit.
adsense_channels:
  practice-top: "8114487175"
  practice-mobile: "2067953570"
  practice-sidebar: "7133200113"
  content: "8441790237"
  tone-results: "5516243990"
  geo-results: "1146502574"

# Build settings
markdown: kramdown

# Plugins
plugins:
  - jekyll-sitemap

exclude:
  - docs/open-ideas-todo.md
  - docs/advertising.md
  - membership-plan.md
  - hanzi_guide_seo_growth_plan.md
  - hanzi_guide_geo_prediction.md
  - hanzi_guide_geo_quiz_question_bank.md
  - chinese_idioms_mandarin_cantonese.md
  - node_modules
  - cdn/*/src
  - cdn/*/demo
  - cdn/*/all.js
  - cdn/*/all.json
  - vendor
  - cdn/*/vendor
