name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Cache dictionaries and fonts
        uses: actions/cache@v4
        with:
          path: |
            assets/cedict_ts.u8
            assets/cccanto.u8
            assets/kids.json
            assets/fonts/
          key: assets-${{ runner.os }}-${{ hashFiles('scripts/fetch-dicts.sh', 'scripts/fetch-fonts.sh') }}
          restore-keys: |
            assets-${{ runner.os }}-

      - name: Fetch dictionaries
        run: bash scripts/fetch-dicts.sh

      - name: Fetch fonts
        run: bash scripts/fetch-fonts.sh

      - name: Generate HSK reference pages
        run: node scripts/generate-hsk1-pages.js

      - name: Build with Jekyll
        run: |
          if [ -n "$ADSENSE_CLIENT_ID" ]; then
            if ! [[ "$ADSENSE_CLIENT_ID" =~ ^ca-pub-[0-9]+$ ]] || { [ -n "$ADSENSE_SLOT_ID" ] && ! [[ "$ADSENSE_SLOT_ID" =~ ^[0-9]+$ ]]; }; then
              echo "Invalid AdSense publisher or slot ID"
              exit 1
            fi
            printf 'adsense_client: "%s"\n' "$ADSENSE_CLIENT_ID" > _config_adsense.yml
            if [ -n "$ADSENSE_SLOT_ID" ]; then
              printf 'adsense_slot: "%s"\n' "$ADSENSE_SLOT_ID" >> _config_adsense.yml
            fi
            bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --config _config.yml,_config_adsense.yml
          else
            echo "Manual ads disabled: configure ADSENSE_CLIENT_ID to enable them."
            bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          fi
          if [[ "$ADSENSE_CLIENT_ID" =~ ^ca-pub-[0-9]+$ ]]; then
            printf 'google.com, %s, DIRECT, f08c47fec0942fa0\n' "${ADSENSE_CLIENT_ID#ca-}" > _site/ads.txt
          fi
        env:
          JEKYLL_ENV: production
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
